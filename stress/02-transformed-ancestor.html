<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stress 02 — transformed ancestor</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { font: 16px Georgia, serif; background: #fdfcf9; color: #2b2b2b; margin: 0; }
  /* Any of these makes an ancestor a containing block for position:fixed.
     Sticky headers, parallax, scroll effects and CSS containment all do it. */
  .fx        { transform: translateZ(0); }
  .filtered  { filter: saturate(1.02); }
  .perspect  { perspective: 1000px; }
  .contained { contain: paint; }
  .page { max-width: 1080px; margin: 0 auto; padding: 24px; }
  .gallery { background: #ece7dd; height: 120px; border-radius: 4px; }
  .card { border: 1px solid #e4ddcf; border-radius: 4px; padding: 16px; margin: 16px 0; }
  .btn { width: 100%; padding: 14px; background: #2b2b2b; color: #fff; border: 0; border-radius: 4px; }
</style></head>
<body>
<p class="st-note"><b>02 · Transformed ancestor.</b> The mount is nested inside
  <code>transform</code> → <code>filter</code> → <code>perspective</code> → <code>contain:paint</code>.
  Each makes an ancestor a containing block for <code>position:fixed</code>.
  <b>PASS:</b> the toast is still pinned to the <i>viewport</i> bottom, not trapped inside the column.</p>
<div class="fx"><div class="filtered"><div class="perspect"><div class="contained">
  <div class="page">
    <div class="gallery">product image</div>
    <div class="card"><button class="btn">Add to cart</button></div>
    <div id="widget-slot"></div>
    <div style="height:60vh"></div>
  </div>
</div></div></div></div>
<script type="module" src="../widget/product-highlights.js"
        data-mount="#widget-slot"
        data-content="../design-starter/sample-content.json"></script>


<script type="module" src="../design-starter/theme-panel.js"></script>
</body></html>
